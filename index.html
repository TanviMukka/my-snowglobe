<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>my snowglobe</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="header">
        <h1>my snowglobe</h1>
        <p class="subtext">shake it for a little winter kindness</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe" />
                </div>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button for some warm winter messages</p>
            </section>
        </main>
        <footer>
            <p>made by tanvi, in the snow</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
